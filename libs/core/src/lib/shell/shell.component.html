<div class="shell-container">
    <mat-sidenav-container>
        <mat-sidenav
            #sidenav
            [mode]="isMobile() ? 'over' : 'side'"
            [opened]="!isMobile()"
            [disableClose]="!isMobile()"
            class="app-sidenav"
        >
            <mat-toolbar color="primary">
                <mat-toolbar-row class="stripped">
                    <span i18n="@@applicationName">Deeproxio</span>
                    <div></div>

                    <div>
                        <button mat-icon-button [matMenuTriggerFor]="userMenu">
                            <mat-icon>person</mat-icon>
                        </button>
                        <mat-menu #userMenu="matMenu">
                            <mat-list>
                                <mat-list-item>
                                    <span i18n="@@loggedInAsLabel">Logged in as</span>
                                    &nbsp;
                                    <b>{{ username() }}</b>
                                </mat-list-item>
                                <mat-divider />
                            </mat-list>
                            <button mat-menu-item (click)="logout()" i18n="@@logoutButton">Logout</button>
                        </mat-menu>
                    </div>

                    <div>
                        <app-lang-selector
                            [languages]="languages()"
                            [current]="currentLanguage()"
                            (selected)="setLanguage($event)"
                        />
                    </div>
                </mat-toolbar-row>
            </mat-toolbar>

            <nav>
                <mat-list>
                    <mat-divider />
                    <a mat-list-item routerLink="/home" routerLinkActive="active">
                        <span i18n="@@navHome">Home</span>
                    </a>
                    <mat-divider />
                    <a mat-list-item routerLink="/about" routerLinkActive="active">
                        <span i18n="@@navAbout">About</span>
                    </a>
                    <mat-divider />
                </mat-list>
            </nav>
        </mat-sidenav>

        <mat-sidenav-content>
            <mat-toolbar color="primary" class="mat-elevation-z6">
                <mat-toolbar-row class="stripped">
                    <button class="menu-button" mat-icon-button (click)="sidenav.toggle()">
                        <mat-icon>menu</mat-icon>
                    </button>
                    <span>{{ title() }}</span>
                </mat-toolbar-row>
            </mat-toolbar>
            <router-outlet />
        </mat-sidenav-content>
    </mat-sidenav-container>
</div>

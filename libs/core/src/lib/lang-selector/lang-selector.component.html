<button type="button" color="primary" mat-raised-button [matMenuTriggerFor]="menu">
    {{ current() }}
    <span class="caret"></span>
</button>

<mat-menu #menu="matMenu" [overlapTrigger]="false" yPosition="above" xPosition="before">
    @for (language of languages(); track language) {
        <button type="button" mat-menu-item class="lang-selector-item" (click)="onLanguageSelected(language)">
            <span class="language-title">{{ language }}</span>

            @if (current() === language) {
                <mat-icon>done</mat-icon>
            }
        </button>
    }
</mat-menu>

<h3 mat-dialog-title i18n="@@logoutPromptTitle">Log Out</h3>

<mat-dialog-content i18n="@@logoutPromptMessage">Are you sure you want to log out?</mat-dialog-content>

<mat-dialog-actions>
    <button mat-button (click)="cancel()" i18n="@@logoutPromptNo">No</button>
    <button mat-button (click)="confirm()" i18n="@@logoutPromptYes">Yes</button>
</mat-dialog-actions>

<div class="reset-page mat-typography">
    <div class="reset-page__header">
        <p>
            <img class="logo" src="assets/deeproxio-logo.png" alt="Deeproxio logo" />
        </p>
        <h1 i18n="@@applicationNameHeading">Deeproxio</h1>
    </div>

    <div class="reset-page__content">
        <mat-toolbar-row>
            <button color="secondary" mat-raised-button class="version">environment: {{ version() }}</button>

            <button color="accent" mat-raised-button (click)="goToLogin()" i18n="@@loginNavigationBtn">Login</button>

            <span class="language-selector">
                <app-lang-selector
                    [languages]="languages()"
                    [current]="currentLanguage()"
                    (selected)="setLanguage($event)"
                />
            </span>
        </mat-toolbar-row>

        <app-reset-password [pending]="pending()" [errorMessage]="error()" (submitted)="onSubmit($event)" />
    </div>
</div>

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Angular ES Modules support
    types {
        application/javascript js mjs;
    }

    # SECURITY: Disable Nginx version signature in headers and error pages
    server_tokens off;

    # SECURITY: Optimize buffers to mitigate buffer overflow attacks
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 8k;

    # SECURITY: Set timeouts to mitigate DDoS attacks
    client_body_timeout 12;
    client_header_timeout 12;
    keepalive_timeout 15;
    send_timeout 10;

    server {
        listen 8080;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;

        # SECURITY: Global security headers for XSS, Clickjacking, and MIME sniffing protection
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        
        # SECURITY OPTION: Content Security Policy (Basic SPA configuration)
        # Uncomment and adjust the line below based on your external API endpoints requirements
        # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://localhost:4200;" always;

        # Gzip compression configuration
        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types 
            text/plain 
            text/css 
            application/json 
            application/javascript 
            application/x-javascript 
            text/xml 
            application/xml 
            application/xml+rss 
            text/javascript 
            image/svg+xml;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # PERFORMANCE & SECURITY: Aggressive caching for immutable compiled application assets
        location ~* \.(?:ico|css|js|mjs|gif|jpe?g|png|svg|woff2?|eot|ttf)$ {
            expires 1y;
            access_log off;
            log_not_found off;
            # Inherit core security headers inside regex location match block
            X-Frame-Options "SAMEORIGIN" always;
            X-Content-Type-Options "nosniff" always;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }
}

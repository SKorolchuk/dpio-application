<div class="container">
    <mat-card>
        <p></p>
        <mat-card-content>
            <mat-card-title i18n="@@homePageHeading">Home Dashboard Workspace</mat-card-title>

            <mat-card-subtitle>
                <app-loader [isLoading]="isLoading()" />

                @if (!isLoading() && quote()) {
                    <q>{{ quote() }}</q>
                }
            </mat-card-subtitle>
        </mat-card-content>
    </mat-card>
</div>
